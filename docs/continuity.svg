<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Continuity checking. One event in the world graph, the launch moving from May 1 to May 15, fans out into five artifacts: a meeting transcript, a Slack message, a Notion page, an email to the client, and a Linear milestone. The checker reads each one against the graph. The transcript, Slack, and Notion agree. The email says May 12, which contradicts the graph, so it is repaired to May 15. The Linear milestone still says May 1, but that staleness was planted on purpose and tagged, so it passes as drift. Result: five of five continuous, one drift tagged.">
<style>
  .a { animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .ink { fill: #ECE8E1; } .dim { fill: #8F96A3; } .bronze { fill: #D08C4A; } .green { fill: #7CC38C; } .red { fill: #E5484D; } .amber { fill: #E0B252; }
  .card { fill: #1C1F27; stroke: #2E323D; stroke-width: 1.5; }
  .scene { animation-name: scene; } @keyframes scene { 0%, 94% { opacity: 1; } 98.5%, 100% { opacity: 0; } }
  .f1 { animation-name: f1; } @keyframes f1 { 0%, 6% { opacity: 0; } 10%, 100% { opacity: 1; } }
  .f2 { animation-name: f2; } @keyframes f2 { 0%, 10% { opacity: 0; } 14%, 100% { opacity: 1; } }
  .f3 { animation-name: f3; } @keyframes f3 { 0%, 14% { opacity: 0; } 18%, 100% { opacity: 1; } }
  .f4 { animation-name: f4; } @keyframes f4 { 0%, 18% { opacity: 0; } 22%, 100% { opacity: 1; } }
  .f5 { animation-name: f5; } @keyframes f5 { 0%, 22% { opacity: 0; } 26%, 100% { opacity: 1; } }
  .panel { animation-name: panel; } @keyframes panel { 0%, 28% { opacity: .25; } 32%, 100% { opacity: 1; } }
  .k1 { animation-name: k1; } @keyframes k1 { 0%, 34% { opacity: 0; } 37%, 100% { opacity: 1; } }
  .k2 { animation-name: k2; } @keyframes k2 { 0%, 38% { opacity: 0; } 41%, 100% { opacity: 1; } }
  .k3 { animation-name: k3; } @keyframes k3 { 0%, 42% { opacity: 0; } 45%, 100% { opacity: 1; } }
  /* the email: wrong date shown, caught, repaired */
  .bad { opacity: 0; animation-name: bad; } @keyframes bad { 0%, 17% { opacity: 0; } 20%, 62% { opacity: 1; } 66%, 100% { opacity: 0; } }
  .good { animation-name: good; } @keyframes good { 0%, 63% { opacity: 0; } 67%, 100% { opacity: 1; } }
  .x4 { opacity: 0; animation-name: x4; } @keyframes x4 { 0%, 46% { opacity: 0; } 49%, 64% { opacity: 1; } 67%, 100% { opacity: 0; } }
  .fix { opacity: 0; animation-name: fix; } @keyframes fix { 0%, 55% { opacity: 0; } 58%, 66% { opacity: 1; } 69%, 100% { opacity: 0; } }
  .k4 { animation-name: k4; } @keyframes k4 { 0%, 67% { opacity: 0; } 70%, 100% { opacity: 1; } }
  .emailcard { animation-name: emailcard; } @keyframes emailcard { 0%, 46% { stroke: #2E323D; } 49%, 64% { stroke: #E5484D; } 67%, 100% { stroke: #2E323D; } }
  .k5 { animation-name: k5; } @keyframes k5 { 0%, 72% { opacity: 0; } 75%, 100% { opacity: 1; } }
  .sum { animation-name: sum; } @keyframes sum { 0%, 78% { opacity: 0; } 82%, 100% { opacity: 1; } }
</style>
<rect width="1000" height="420" rx="18" fill="#14161C"/>
<text x="40" y="44" class="mono dim" font-size="11" letter-spacing="1">CONTINUITY · ONE EVENT, EVERY APP</text>

<g class="a scene">
  <!-- the event -->
  <rect x="40" y="150" width="210" height="108" rx="10" fill="#2A2118" stroke="#D08C4A" stroke-width="1.6"/>
  <text x="58" y="178" class="mono bronze" font-size="11" letter-spacing="1">EVENT · TUE 10:00</text>
  <text x="58" y="204" class="sans ink" font-size="15" font-weight="600">Launch moves</text>
  <text x="58" y="230" class="sans ink" font-size="15">May 1 → May 15</text>

  <g stroke="#D08C4A" stroke-width="1.3" stroke-opacity=".7" fill="none">
    <path class="a f1" d="M250 204 C 285 204, 290 82, 318 82"/>
    <path class="a f2" d="M250 204 C 285 204, 290 146, 318 146"/>
    <path class="a f3" d="M250 204 L 318 210"/>
    <path class="a f4" d="M250 204 C 285 204, 290 274, 318 274"/>
    <path class="a f5" d="M250 204 C 285 204, 290 338, 318 338"/>
  </g>

  <!-- artifacts -->
  <g class="sans" font-size="13">
    <g class="a f1"><rect x="318" y="58" width="330" height="48" rx="8" class="card"/><text x="334" y="78" class="dim" font-size="11">Meeting transcript · Tue 10:00</text><text x="334" y="96" class="ink">“…let’s move launch to the 15th.”</text></g>
    <g class="a f2"><rect x="318" y="122" width="330" height="48" rx="8" class="card"/><text x="334" y="142" class="dim" font-size="11">Slack #client-acme · Tue 10:40</text><text x="334" y="160" class="ink">“heads up, launch is May 15 now”</text></g>
    <g class="a f3"><rect x="318" y="186" width="330" height="48" rx="8" class="card"/><text x="334" y="206" class="dim" font-size="11">Notion · Project page · Wed</text><text x="334" y="224" class="ink">Launch date: May 15</text></g>
    <g class="a f4"><rect x="318" y="250" width="330" height="48" rx="8" class="a card emailcard"/><text x="334" y="270" class="dim" font-size="11">Email to client · Wed</text>
      <text x="334" y="288" class="a ink good">“…confirming launch on May 15.”</text>
      <text x="334" y="288" class="a red bad">“…confirming launch on May 12.”</text></g>
    <g class="a f5"><rect x="318" y="314" width="330" height="48" rx="8" class="card"/><text x="334" y="334" class="dim" font-size="11">Linear · Milestone</text><text x="334" y="352" class="ink">Due: May 1</text>
      <rect x="560" y="330" width="76" height="20" rx="10" fill="#3A3020"/><text x="598" y="344" text-anchor="middle" class="amber mono" font-size="10">stale · tagged</text></g>
  </g>

  <!-- checker -->
  <g class="a panel">
    <rect x="680" y="58" width="280" height="304" rx="10" class="card"/>
    <text x="700" y="86" class="sans ink" font-size="14" font-weight="600">Continuity check</text>
    <text x="700" y="104" class="sans dim" font-size="11">each claim read against the world graph</text>
  </g>
  <g class="sans" font-size="13">
    <g class="a k1"><text x="700" y="140" class="green" font-weight="700">✓</text><text x="722" y="140" class="ink">Transcript agrees</text></g>
    <g class="a k2"><text x="700" y="176" class="green" font-weight="700">✓</text><text x="722" y="176" class="ink">Slack agrees</text></g>
    <g class="a k3"><text x="700" y="212" class="green" font-weight="700">✓</text><text x="722" y="212" class="ink">Notion agrees</text></g>
    <g class="a x4"><text x="700" y="248" class="red" font-weight="700">✗</text><text x="722" y="248" class="ink">Email says May 12</text><text x="722" y="266" class="red" font-size="11">contradicts the graph</text></g>
    <g class="a fix"><text x="722" y="282" class="bronze" font-size="11">→ repair: rewrite the email only</text></g>
    <g class="a k4"><text x="700" y="248" class="green" font-weight="700">✓</text><text x="722" y="248" class="ink">Email agrees (repaired)</text></g>
    <g class="a k5"><text x="700" y="290" class="amber" font-weight="700">✓</text><text x="722" y="290" class="ink">Linear stale, as planted</text></g>
  </g>
  <text class="a sum green sans" x="700" y="336" font-size="13" font-weight="600">5 of 5 continuous · 1 drift tagged</text>
</g>
</svg>
