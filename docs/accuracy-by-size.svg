<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 374" width="680" height="374" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Share of runs answered correctly at each workspace size</title>
<desc id="fig-desc">Three panels show runs answered correctly at workspace sizes of 59, 274, 1,319, 4,225 files. Lookup questions were answered correctly in 39, 39, 38, 39 of 39 runs, and sweep questions in 24, 24, 18, 21 of 24. The late-payer sweep question alone was answered correctly in 6, 6, 1, 3 of 6 runs, and 4 of 12 at the two largest sizes became 12 of 12 when the invoicing export was deleted.</desc>
