# Persona pack: an independent brand designer who works on monthly retainers.
# Same engine as the CPA pack. Only the people, the wording and the noise differ.

id = "studio-retainer"
today = "2026-07-27"
core_months = ["2026-04", "2026-05"]

[persona]
name = "Maya Okonkwo"
first = "Maya"
email = "maya@okonkwostudio.example"
org = "Okonkwo Studio"
role = "Independent brand designer"
city = "Portland, OR"
timezone = "America/Los_Angeles"
greeting = "Hey {first},"
signoff = "Cheers,\nMaya"

[assistant]
name = "Jules Tran"
first = "Jules"
handle = "jules"
email = "jules@okonkwostudio.example"
role = "Part-time studio manager"

[bank]
name = "Cascadia Credit Union"
email = "notify@cascadiacu.example"

[vocab]
counterparty = "client"
cycle = "retainer"
materials = "inputs"
service = "brand and campaign design on a monthly retainer"
request_subject = "{month} inputs for {org}"
request_ask = "Can you send the {month} {deliverables} when you have a moment? Ideally by {ask_by} so I can plan the next round."
deliverables = ["analytics export", "campaign calendar", "asset request list", "sales summary", "feedback log"]
row_labels = ["HOMEPAGE SESSIONS", "EMAIL CAMPAIGN", "PAID SOCIAL", "ORGANIC SOCIAL", "PRODUCT PAGE", "CHECKOUT",
  "RETURNS", "NEW SUBSCRIBERS", "WHOLESALE ORDER", "POPUP EVENT", "REFERRAL", "GIFT CARDS"]
meeting_title = "{month} retainer review - {org}"
meeting_noun = "retainer review"
invoice_subject = "Invoice {invoice_no} - {month} retainer"
invoice_item = "Design retainer, {month}"
unit = "hours"
rate_choices = [95, 110, 120, 135, 150]
qty_min = 6.0
qty_max = 24.0
invoice_direction = "outgoing"
payment_line = "Incoming ACH payment of {amount} from {payer} was posted on {date}. Memo: {invoice_no}"
modes = ["Zoom", "Phone", "Office"]

[voice]
openers = ["Hope the launch week treated you well.", "Quick monthly ask.", "", "Loved the new window display, by the way.", "Round two of the month coming up."]
contact_openers = ["Here's everything.", "Sorry, this sat in my drafts.", "", "Pulled these this morning.", "Tell me if a file is missing."]
closers = ["Holler with questions.", "", "More soon.", "Thanks for keeping this easy."]
reschedule_reasons = [
  "we have a photo shoot booked in the space that day",
  "I'm at a trade show and the wifi is hopeless",
  "our printer moved the proof review to that slot",
  "I have a school thing I can't skip",
  "the team offsite got moved onto that morning",
]
correction_reasons = [
  "I counted the packaging revisions twice",
  "the hours for the extra banner set were left off",
  "I missed the time on the second logo round",
  "I used the old hourly rate by mistake",
]
note_lines = [
  "Reviewed the {month} campaign results; {n} assets flagged for a refresh.",
  "Walked through the {month} asset requests; {n} still waiting on copy.",
  "Looked at the {month} analytics together; {n} pages to rework.",
]
follow_ups = ["final copy for the mailer", "the updated product photos", "the wholesale price sheet", "brand guideline notes"]
personal_events = ["Pottery class", "Vet appointment", "Climbing gym", "Dinner with Ade", "Bike tune-up", "School concert",
  "Portfolio review night", "Haircut", "Saturday market", "Run club"]
chatter = ["Plotter is jammed again.", "Samples arrived from the printer.", "Can you renew the font licence?",
  "Back after lunch.", "Coffee run?", "The courier needs a signature.", "Backed up the shared drive.",
  "Heading to the print shop.", "Left the swatch book on your desk."]
extension_reasons = [
  "our payment run only goes out twice a month",
  "we're waiting on a wholesale deposit to clear",
  "the owner is travelling and approves the transfers",
]

