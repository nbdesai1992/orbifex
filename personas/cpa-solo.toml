# Persona pack: a solo CPA whose working life is a monthly close for each client.
# The engine supplies the fact sentences (times, totals, due dates). This file
# supplies who exists, what the work is called, and how people write.

id = "cpa-solo"
today = "2026-07-27"          # the environment's present; nothing is dated after it
core_months = ["2026-04", "2026-05"]

[persona]
name = "Dana Whitfield"
first = "Dana"
email = "dana@whitfieldcpa.example"
org = "Whitfield Accounting"
role = "Solo CPA"
city = "Columbus, OH"
timezone = "America/New_York"
greeting = "Hi {first},"
signoff = "Thanks,\nDana"

[assistant]
name = "Marco Ilves"
first = "Marco"
handle = "marco"
email = "marco@whitfieldcpa.example"
role = "Part-time bookkeeper"

[bank]
name = "Lakeshore Community Bank"
email = "alerts@lakeshorecb.example"
account = "Business Checking ending 4417"
# Lines that recur on the bank export every month: description, amount, day of month.
recurring = [["OFFICE RENT HARBORVIEW PROPERTIES", -1650.00, 1], ["LEDGERLINE SOFTWARE SUBSCRIPTION", -79.00, 5],
  ["CITY POWER AND LIGHT AUTOPAY", -142.37, 12], ["PAYROLL M ILVES", -1480.00, 15],
  ["OWNER DRAW D WHITFIELD", -4200.00, 25], ["PAYROLL M ILVES", -1480.00, 28]]
card_merchants = ["CORNER COFFEE", "PARKING METER", "POSTAL COUNTER", "LUNCH COUNTER", "RIDESHARE", "FUEL STOP", "PRINT SHOP"]

# A retailer the persona orders from. Orders, refunds and card charges give the
# workspace a second kind of record that has nothing to do with client work.
[shop]
name = "Northfield Office Supply"
email = "orders@northfieldsupply.example"
prefix = "NS"
items = [["Copy paper, case of 10 reams", 54.99], ["Toner cartridge, black", 89.50], ["Banker boxes, pack of 12", 38.75],
  ["Hanging file folders, box of 50", 27.40], ["Desk lamp, LED", 64.00], ["Label maker tape, 3 pack", 31.20],
  ["Wireless keyboard", 72.95], ["Printer drum unit", 118.00], ["Shredder oil, 12 oz", 14.60], ["Monitor stand", 46.25],
  ["Legal pads, pack of 12", 22.80], ["Scanner feed rollers", 58.30]]

# How the engagement cycle is worded for this persona.
[vocab]
counterparty = "client"
cycle = "close"
materials = "documents"
service = "monthly bookkeeping and close services"
row_labels = ["POS DEPOSIT", "ACH PAYROLL", "CARD SETTLEMENT", "UTILITY AUTOPAY", "SUPPLY ORDER", "INSURANCE PREMIUM",
  "RENT", "MERCHANT FEE", "CHECK", "REFUND", "SOFTWARE SUBSCRIPTION", "FUEL", "STATE TAX PAYMENT",
  "TRANSFER FROM SAVINGS", "EQUIPMENT LEASE"]
request_subject = "{month} documents for {org}"
request_ask = "Could you send over the {month} {deliverables} when you get a chance? I'd like to have everything by {ask_by}."
deliverables = ["bank statements", "credit card statements", "payroll summary", "sales tax report", "merchant deposits report"]
delivery_line = "Attached are the {month} {deliverables}."
meeting_title = "{month} close review - {org}"
meeting_noun = "close review"
invoice_subject = "Invoice {invoice_no} - {month} close"
invoice_item = "Monthly bookkeeping and close, {month}"
unit = "hours"
rate_choices = [145, 150, 160, 165, 175, 185]
qty_min = 4.0
qty_max = 13.5
invoice_direction = "outgoing"   # the persona bills the counterparty
payment_line = "Incoming ACH payment of {amount} from {payer} was posted on {date}. Memo: {invoice_no}"
modes = ["Zoom", "Phone", "Office"]

[voice]
openers = [
  "Hope the week is going well.",
  "Quick one from me.",
  "Following up on the monthly cycle.",
  "",
  "Thanks for the quick turnaround last month.",
]
contact_openers = [
  "Sorry for the delay on this.",
  "Here you go.",
  "Sending these before I forget.",
  "",
  "Let me know if anything is missing.",
]
closers = [
  "Let me know if anything looks off.",
  "Shout if you have questions.",
  "",
  "Talk soon.",
]
reschedule_reasons = [
  "a supplier visit landed on that morning",
  "I have a dentist appointment I can't move",
  "our office is closed for an inspection that day",
  "I'm traveling and will be on a plane",
  "payroll deadline moved up and I'll be buried",
]
correction_reasons = [
  "I logged the payroll reconciliation twice",
  "I missed the time spent on the sales tax amendment",
  "the hours from the second review call were left off",
  "I applied last year's rate by mistake",
]
note_lines = [
  "Walked through the {month} bank reconciliation; {n} items still open.",
  "Reviewed the {month} payroll entries; {n} need a second look.",
  "Went over the {month} sales tax workpaper; {n} adjustments noted.",
]
follow_ups = ["missing receipts", "the loan statement", "the updated payroll register", "vendor W-9s"]
personal_events = ["Dentist", "School pickup", "Gym", "Dinner with Ruth", "Car service", "Parent-teacher conference",
  "CPE webinar", "Haircut", "Farmers market", "Book club"]
chatter = ["Printer is out of toner again.", "Dropped the mail at the box.", "Can you check the payroll login?",
  "Back at 2.", "Coffee order?", "The scanner ate another receipt.", "Renewed the software licence.",
  "Stepping out for the bank run.", "Left the signed forms on your desk."]
extension_reasons = [
  "our card processor is holding deposits this week",
  "we're waiting on an insurance reimbursement",
  "the owner is out until the end of the month and signs the checks",
]

