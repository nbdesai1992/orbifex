# Mail that has nothing to do with any client. Volume rises with the tier.
[[noise]]
sender = "Vale Society of CPAs <news@valecpa.example>"
subjects = ["This week: CPE deadlines and member news", "Tax practice update for {mon}", "Register now: ethics webinar"]
bodies = [
  "This month's update covers changes to estimated payment safe harbors, a reminder about CPE reporting, and a members-only webinar on Thursday at 2:00 PM. Early registration is $45.00 through {date}.",
  "Members asked for a plain summary of the new information return thresholds. The short version is in the attached brief. Our fall conference is {date}; the member rate is $325.00.",
]

[[noise]]
sender = "LedgerLoop <billing@ledgerloop.example>"
subjects = ["Your LedgerLoop receipt", "Your plan renews soon", "New: bank feed rules"]
bodies = [
  "Thanks for your payment of $89.00 on {date}. Your next billing date is one month out. Invoice LL-{n4} is attached for your records.",
  "Bank feed rules can now be shared across client files. The release goes out {date} at 9:00 AM Eastern.",
]

[[noise]]
