[project]
name = "orbifex"
version = "0.2.0"
description = "From a persona to a checked agent environment, exported as Harbor tasks."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Neal Desai" }]
dependencies = []

[project.scripts]
orbifex = "orbifex.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
